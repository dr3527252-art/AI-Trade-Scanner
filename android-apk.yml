name: Build AI Trade Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI_Trade_Scanner_Mobile_Build_Ready.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app source ZIP
        run: |
          test -f AI_Trade_Scanner_Mobile_Build_Ready.zip
          mkdir app-source
          unzip -q AI_Trade_Scanner_Mobile_Build_Ready.zip -d app-source
          test -f app-source/mobile/pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app-source/mobile
        run: flutter create . --platforms=android

      - name: Add Android permissions
        working-directory: app-source/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '    <uses-permission android:name="android.permission.INTERNET"/>\\n    <uses-permission android:name="android.permission.CAMERA"/>\\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + '\\n' + perms)
          p.write_text(s)
          PY

      - name: Install Flutter dependencies
        working-directory: app-source/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: app-source/mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-Scanner-APK
          path: app-source/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
